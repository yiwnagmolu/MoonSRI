name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: Check deployment journals, live checkpoints and rollback
        shell: bash
        env:
          MOON_TARGET: ${{ matrix.target }}
        run: |
          moon build --release --target "$MOON_TARGET" cmd/main
          runner=moonrun
          if [ "$MOON_TARGET" = js ]; then runner=node; fi
          artifact="_build/$MOON_TARGET/release/build/cmd/main/main.$MOON_TARGET"
          node tests/release-order.mjs "$runner" "$artifact"
          node tests/release-live.mjs "$runner" "$artifact"
      - name: CLI smoke test
        shell: bash
        run: |
          expected='sha384-uY+OtEjszwPe7jcYKI1KfAGMrLSMeFfhJc/DWf9ccFpWjjw1tKO9St/U0k2N8ONW'
          actual="$(moon run cmd/main --target ${{ matrix.target }} -- generate examples/hello.js)"
          test "$actual" = "$expected"
          moon run cmd/main --target ${{ matrix.target }} -- check examples/hello.js "$expected"

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          binary="$work/binary input.js"
          expected="$(node - "$binary" <<'NODE'
          const fs = require("node:fs");
          const { createHash } = require("node:crypto");
          const data = Buffer.alloc(2 * 65536 + 17);
          for (let index = 0; index < data.length; index++) {
            data[index] = index % 251;
          }
          fs.writeFileSync(process.argv[2], data);
          console.log(["sha512", "sha256", "sha384"].map(
            name => name + "-" + createHash(name).update(data).digest("base64")
          ).join(" "));
          NODE
          )"
          actual="$(moon run cmd/main --target ${{ matrix.target }} -- generate "$binary" sha512,sha256,sha384)"
          test "$actual" = "$expected"
          moon run cmd/main --target ${{ matrix.target }} -- check "$binary" "$expected"

          diagnostics="$(mktemp)"
          trap 'rm -f -- "$diagnostics"; rm -rf -- "$work"' EXIT
          status=0
          rejected="$(moon run cmd/main --target ${{ matrix.target }} -- check "$work" sha999-invalid 2>"$diagnostics")" || status=$?
          test "$status" -eq 2
          test -z "$rejected"
          [[ "$(<"$diagnostics")" == *'Cannot read file:'* ]]
          status=0
          rejected="$(moon run cmd/main --target ${{ matrix.target }} -- typo generate examples/hello.js 2>"$diagnostics")" || status=$?
          test "$status" -eq 2
          test -z "$rejected"
          [[ "$(<"$diagnostics")" == *'Usage:'* ]]
          status=0
          report="$(moon run cmd/main --target ${{ matrix.target }} -- check-manifest --json 2>"$diagnostics")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$diagnostics")" == *'Usage:'* ]]
      - name: HTML tag smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          script="$(run_cli tag script examples/hello.js hello.js)"
          stylesheet="$(run_cli tag stylesheet examples/style.css style.css)"
          demo="$(< examples/browser.html)"
          [[ "$demo" == *"$script"* ]]
          [[ "$demo" == *"$stylesheet"* ]]
          escaped="$(run_cli tag script examples/hello.js 'hello.js?q="a"&lang=zh')"
          [[ "$escaped" == *'src="hello.js?q=&quot;a&quot;&amp;lang=zh"'* ]]
          status=0
          unsafe="$(run_cli tag script examples/hello.js 'javascript:alert(1)')" || status=$?
          test "$status" -eq 2
          test -z "$unsafe"
          preload="$(run_cli tag preload examples/hello.js 'hello.js?v=1' script)"
          [[ "$preload" == *'<link rel="preload" href="hello.js?v=1" as="script"'* ]]
          module_preload="$(run_cli tag modulepreload examples/hello.js 'app.mjs')"
          [[ "$module_preload" == *'<link rel="modulepreload" href="app.mjs"'* ]]
          sha512_preload="$(run_cli tag preload examples/hello.js 'hello.js' font sha512)"
          [[ "$sha512_preload" == *'as="font" integrity="sha512-'* ]]
          status=0
          bad="$(run_cli tag preload examples/hello.js 'hello.js' xhr)" || status=$?
          test "$status" -eq 2
          test -z "$bad"
          status=0
          bad="$(run_cli tag preload examples/hello.js 'hello.js')" || status=$?
          test "$status" -eq 2
          test -z "$bad"
      - name: Batch manifest smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          temp_dir="$(mktemp -d .moonsri-test.XXXXXX)"
          run_cli manifest --root examples hello.js > "$temp_dir/rooted.json"
          test "$(run_cli check-manifest --root examples "$temp_dir/rooted.json")" = 'match: "hello.js"'
          test "$(run_cli check-manifest --root examples/ "$temp_dir/rooted.json")" = 'match: "hello.js"'
          printf '%s\n' '{"hello.js":"sha384-invalid","../README.md":"sha384-invalid"}' > "$temp_dir/invalid-root.json"
          status=0
          report="$(run_cli check-manifest --root examples "$temp_dir/invalid-root.json")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/rooted.json"
          printf '%s\n' '{"hello.js":"sha384-invalid","asset?.js":"sha384-invalid"}' > "$temp_dir/nonportable.json"
          status=0
          report="$(run_cli check-manifest --root examples --json "$temp_dir/nonportable.json" 2>"$temp_dir/nonportable.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/nonportable.err")" == *'Expected a portable relative asset path:'* ]]
          printf '%s\n' '{"style.css":"sha384-new","hello.js":"sha384-updated"}' > "$temp_dir/next.json"
          status=0
          report="$(run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/next.json")" || status=$?
          test "$status" -eq 1
          grep -Fq 'changed: "hello.js"' <<< "$report"
          grep -Fq 'added: "style.css"' <<< "$report"
          status=0
          run_cli manifest --root examples ../README.md || status=$?
          test "$status" -eq 2
          asset="$temp_dir/copied style.css"
          manifest="$temp_dir/integrity.json"
          cp examples/style.css "$asset"
          printf '\357\273\277examples/hello.js\r\n\r\n%s\r\n' "$asset" > "$temp_dir/assets.txt"
          run_cli manifest --from "$temp_dir/assets.txt" > "$temp_dir/from-list.json"
          run_cli check-manifest "$temp_dir/from-list.json"
          run_cli manifest --algorithm sha256 examples/hello.js > "$temp_dir/weak.json"
          run_cli check-manifest --min-algorithm sha256 "$temp_dir/weak.json"
          status=0
          report="$(run_cli check-manifest --json --min-algorithm sha384 "$temp_dir/weak.json")" || status=$?
          test "$status" -eq 1
          grep -Fq '"examples/hello.js": "below_minimum"' <<< "$report"
          sha256="$(run_cli generate examples/hello.js sha256)"
          sha512="$(run_cli generate examples/hello.js sha512)"
          combined="$(run_cli generate examples/hello.js sha256,sha512)"
          test "$combined" = "$sha256 $sha512"
          run_cli manifest --algorithm sha256,sha512 examples/hello.js "$asset" > "$manifest"
          node -e 'const manifest = require(process.argv[1]); if (manifest["examples/hello.js"] !== process.argv[2]) process.exit(1)' "./$manifest" "$combined"
          report="$(run_cli check-manifest "$manifest")"
          grep -Fq 'match: "examples/hello.js"' <<< "$report"
          grep -Fq "match: \"$asset\"" <<< "$report"

          printf '\n/* changed */\n' >> "$asset"
          status=0
          report="$(run_cli check-manifest "$manifest")" || status=$?
          test "$status" -eq 1
          grep -Fq "mismatch: \"$asset\"" <<< "$report"

          glob_dir="$temp_dir/glob-site"
          mkdir -p "$glob_dir/assets/css"
          cp examples/hello.js "$glob_dir/assets/app.js"
          cp examples/hello.js "$glob_dir/assets/lib.v2.js"
          cp examples/style.css "$glob_dir/assets/css/site.css"
          cp examples/style.css "$glob_dir/assets/top.css"
          run_cli manifest --root "$glob_dir" 'assets/*.js' 'assets/**/*.css' > "$temp_dir/glob.json"
          grep -Fq '"assets/app.js"' "$temp_dir/glob.json"
          grep -Fq '"assets/lib.v2.js"' "$temp_dir/glob.json"
          grep -Fq '"assets/css/site.css"' "$temp_dir/glob.json"
          grep -Fq '"assets/top.css"' "$temp_dir/glob.json"
          run_cli check-manifest --root "$glob_dir" "$temp_dir/glob.json"
          status=0
          report="$(run_cli manifest --root "$glob_dir" 'assets/*.woff2' 2>"$temp_dir/glob.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/glob.err")" == *'No asset matches glob:'* ]]
          status=0
          report="$(run_cli manifest --root "$glob_dir" 'assets/**/' 2>"$temp_dir/glob.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/glob.err")" == *'Invalid asset glob:'* ]]
          status=0
          report="$(run_cli manifest --root "$glob_dir" 'assets/*.js' 'assets/app.js' 2>"$temp_dir/glob.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/glob.err")" == *'Duplicate asset path:'* ]]
          run_cli manifest 'examples/*.css' > "$temp_dir/cwd-glob.json"
          grep -Fq '"examples/style.css"' "$temp_dir/cwd-glob.json"
          run_cli check-manifest "$temp_dir/cwd-glob.json" >/dev/null
          status=0
          report="$(run_cli manifest 'nonexist/*.js' 2>"$temp_dir/cwd.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/cwd.err")" == *'No asset matches glob:'* ]]

          status=0
          report="$(run_cli check-manifest --json "$manifest")" || status=$?
          test "$status" -eq 1
          node -e 'const report = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (report["examples/hello.js"] !== "match" || report[process.argv[1]] !== "mismatch") process.exit(1)' "$asset" <<< "$report"

          mv "$asset" "$temp_dir/moved.css"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          printf '{"examples/hello.js":"sha256-a","examples/hello.js":"sha256-b"}\n' > "$manifest"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          if [ "${{ matrix.target }}" = js ]; then
            node - "$manifest" "$temp_dir" <<'JS'
          const fs = require("node:fs");
          const entries = Array.from({ length: 3000 }, (_, i) => [
            process.argv[3] + "/missing-asset-" + i + ".css",
            "sha384-invalid",
          ]);
          fs.writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(entries)));
          JS
            status=0
            report="$(run_cli check-manifest --json "$manifest")" || status=$?
            test "$status" -eq 2
            node -e 'const results = Object.values(JSON.parse(require("node:fs").readFileSync(0, "utf8"))); if (results.length !== 3000 || results.some(result => result !== "read_error")) process.exit(1)' <<< "$report"
          fi
      - name: HTML audit smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          site="$(mktemp -d .moonsri-audit.XXXXXX)"
          mkdir -p "$site/docs" "$site/site assets"
          cp examples/hello.js "$site/app main.js"
          cp examples/hello.js "$site/site assets/app main.js"
          cp examples/style.css "$site/style.css"
          run_cli tag script examples/hello.js '../app%20main.js?v=1' > "$site/docs/ok.html"
          printf '%s\n' '<base href=" / ">' > "$site/docs/base.html"
          run_cli tag script examples/hello.js 'app%20main.js' >> "$site/docs/base.html"
          report="$(run_cli audit-html --root "$site" --json docs/ok.html docs/base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.status !== "ok" || p.resources.length !== 1 || p.resources[0].status !== "match" || p.resources[0].path !== "app main.js")) process.exit(1)' <<< "$report"

          printf '%s\n' '<base href="../site%20assets/">' > "$site/docs/local-base.html"
          printf '%s\n' '<base href="/site%20assets/home.html">' > "$site/docs/file-base.html"
          run_cli tag script examples/hello.js 'app%20main.js' | tee -a "$site/docs/local-base.html" >> "$site/docs/file-base.html"
          report="$(run_cli audit-html --root "$site" --json docs/local-base.html docs/file-base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.resources[0]?.path !== "site assets/app main.js" || p.resources[0]?.status !== "match")) process.exit(1)' <<< "$report"

          cp "$site/docs/ok.html" "$site/docs/fail.html"
          printf '%s\n' '<link rel=stylesheet href=/style.css>' '<script src="https://cdn.example/app.js"></script>' >> "$site/docs/fail.html"
          status=0
          report="$(run_cli audit-html --root "$site" --json docs/fail.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.status !== "failed" || page.resources.map(r => r.status).join(",") !== "match,missing_integrity,external") process.exit(1)' <<< "$report"

          status=0
          report="$(run_cli audit-html --root examples --json browser.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.resources.map(r => r.status).join(",") !== "match,match,mismatch") process.exit(1)' <<< "$report"

          printf '%s\n' '<base href="https://cdn.example/assets/"><script src="app.js"></script>' > "$site/docs/unsupported.html"
          status=0
          report="$(run_cli audit-html --root "$site" --json docs/unsupported.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.status !== "unsupported_base" || page.resources.length !== 0) process.exit(1)' <<< "$report"

          baseline="$site/baseline.json"
          run_cli manifest --root "$site" 'app main.js' > "$baseline"
          report="$(run_cli audit-html --root "$site" --baseline "$baseline" --json docs/ok.html docs/base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.resources[0]?.baseline.declaration !== "match" || p.resources[0]?.baseline.content !== "match")) process.exit(1)' <<< "$report"

          cp "$site/docs/ok.html" "$site/docs/shared.html"
          run_cli tag script examples/hello.js '../app%20main.js?v=2' sha512 >> "$site/docs/shared.html"
          run_cli tag script examples/hello.js '../app%20main.js?v=3' sha256 >> "$site/docs/shared.html"
          printf '%s\n' '<script src="../app%20main.js" integrity="sha999-invalid"></script>' '<script src="../missing.js" integrity="sha999-invalid"></script>' >> "$site/docs/shared.html"
          status=0
          report="$(run_cli audit-html --root "$site" --min-algorithm sha384 --json docs/shared.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.resources.map(r => r.status).join(",") !== "match,match,below_minimum,no_supported_metadata,read_error") process.exit(1)' <<< "$report"

          printf '\nconsole.log("rebuilt");\n' >> "$site/app main.js"
          run_cli tag script "$site/app main.js" '../app%20main.js' > "$site/docs/rebuilt.html"
          run_cli tag stylesheet "$site/style.css" '/style.css' > "$site/docs/untracked.html"
          run_cli audit-html --root "$site" docs/rebuilt.html
          status=0
          report="$(run_cli audit-html --root "$site" --baseline "$baseline" --json docs/rebuilt.html docs/untracked.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [rebuilt, untracked] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); const a = rebuilt.resources[0], b = untracked.resources[0]; if (a.status !== "match" || a.baseline.declaration !== "drift" || a.baseline.content !== "mismatch" || b.baseline.declaration !== "untracked" || b.baseline.content !== "not_checked") process.exit(1)' <<< "$report"

          run_cli tag preload examples/hello.js '/site%20assets/app%20main.js' script > "$site/docs/preload.html"
          printf '%s\n' '<link rel=stylesheet href=/style.css>' >> "$site/docs/preload.html"
          status=0
          report="$(run_cli audit-html --root "$site" --json docs/preload.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.resources[0].kind !== "preload" || page.resources[0].status !== "match" || page.resources[1].kind !== "stylesheet" || page.resources[1].status !== "missing_integrity") process.exit(1)' <<< "$report"

          printf '%s\n' 'docs/rebuilt.html' 'docs/untracked.html' > "$site/pages.txt"
          report="$(run_cli audit-html --root "$site" --pages-from "$site/pages.txt" --json)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages[0].page !== "docs/rebuilt.html" || pages[1].page !== "docs/untracked.html" || pages.some(p => p.status !== "ok")) process.exit(1)' <<< "$report"
          printf '%s\n' 'docs/ok.html' 'docs/ok.html' > "$site/dup-pages.txt"
          status=0
          report="$(run_cli audit-html --root "$site" --pages-from "$site/dup-pages.txt" --json)" || status=$?
          test "$status" -eq 2
          test -z "$report"
          status=0
          report="$(run_cli audit-html --root "$site" --pages-from "$site/missing.txt" --json)" || status=$?
          test "$status" -eq 2
          test -z "$report"

      - name: HTML reference diff smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          site="$(mktemp -d)"
          trap 'rm -rf -- "$site"' EXIT
          before="$site/before"
          after="$site/after"
          for root in "$before" "$after"; do
            mkdir -p "$root/docs"
            cp examples/hello.js "$root/app.js"
            cp examples/hello.js "$root/optional.js"
            cp examples/style.css "$root/style.css"
          done
          old="$(run_cli generate "$before/app.js" sha384)"
          new="$(run_cli generate "$after/app.js" sha512)"
          css="$(run_cli tag stylesheet "$before/style.css" '/style.css')"
          printf '<script src="../app.js" integrity="%s"></script>\n%s\n<script src="../optional.js" integrity="%s"></script>\n' "$old" "$css" "$old" > "$before/docs/index.html"
          printf '%s\n<script src="/app.js" integrity="%s"></script>\n<script src="/optional.js?v=2" integrity="%s"></script>\n' "$css" "$new" "$old" > "$after/docs/index.html"
          printf '<script src="../app.js?v=1#main" integrity="%s"></script>\n' "$old" > "$before/docs/same.html"
          printf '<base href="/"><script src="app.js?v=1#main" integrity="%s %s"></script>\n' "${old/sha384/SHA384}" "$old" > "$after/docs/same.html"
          cp "$before/docs/same.html" "$before/docs/missing.html"
          printf '%s\n' '<script src="/bad%zz.js"></script>' > "$before/docs/invalid.html"
          cp "$before/docs/invalid.html" "$after/docs/invalid.html"

          run_cli audit-html --root "$before" docs/index.html docs/same.html
          run_cli audit-html --root "$after" docs/index.html docs/same.html
          run_cli diff-html --before-root "$before" --after-root "$after" docs/same.html
          printf '%s\n' 'docs/index.html' 'docs/same.html' > "$site/pages.txt"
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --pages-from "$site/pages.txt" --json)" || status=$?
          test "$status" -eq 1
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages[0].status !== "changed" || pages[1].status !== "unchanged") process.exit(1)' <<< "$report"
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --json docs/index.html docs/index.html)" || status=$?
          test "$status" -eq 2
          test -z "$report"
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --json docs/same.html docs/index.html)" || status=$?
          test "$status" -eq 1
          DIFF_REPORT="$report" node <<'NODE'
          const assert = require("node:assert/strict");
          const [same, changed] = JSON.parse(process.env.DIFF_REPORT);
          assert.equal(same.status, "unchanged");
          assert.equal(changed.status, "changed");
          assert.equal(changed.removed[0].url, "../optional.js");
          assert.equal(changed.added[0].url, "/optional.js?v=2");
          assert.equal(changed.integrity_changed.length, 1);
          const update = changed.integrity_changed[0];
          assert.equal(update.before.position, 1);
          assert.equal(update.after.position, 2);
          assert.equal(update.after.path, "app.js");
          assert.equal(changed.order_changed, true);
          assert.equal(changed.before_order[0].kind, "script");
          assert.equal(changed.after_order[0].kind, "stylesheet");
          NODE
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --json docs/index.html docs/missing.html docs/invalid.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [changed, missing, invalid] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (changed.status !== "changed" || missing.status !== "error" || missing.after_error !== "read_error" || invalid.status !== "error" || invalid.before_error !== "invalid_url" || invalid.after_error !== "invalid_url") process.exit(1)' <<< "$report"

      - name: Constraint graph smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          graph="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/versioned --graph mermaid index.html hours/index.html)"
          [[ "$graph" == *'flowchart LR'* ]]
          [[ "$graph" == *'n0["publish_asset assets/app.v2.js"]'* ]]
          [[ "$graph" == *'subgraph wave2'* ]]
          [[ "$graph" == *'n0 --> n2'* ]]
          status=0
          blocked="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/overwrite --graph mermaid index.html hours/index.html)" || status=$?
          test "$status" -eq 1
          [[ "$blocked" == *'style n0 fill:#ffcccc'* ]]
          [[ "$blocked" == *'n2 --> n0'* ]]
          status=0
          dot="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/overwrite --graph dot index.html hours/index.html)" || status=$?
          test "$status" -eq 1
          [[ "$dot" == *'digraph moonsri {'* ]]
          [[ "$dot" == *'subgraph cluster_wave1'* ]]
          [[ "$dot" == *'color=red'* ]]
          status=0
          report="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/versioned --graph svg index.html hours/index.html)" || status=$?
          test "$status" -eq 2
          test -z "$report"
          status=0
          report="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/versioned --graph mermaid --json index.html hours/index.html)" || status=$?
          test "$status" -eq 2
          test -z "$report"
          status=0
          report="$(run_cli review-release --before-root examples/rollout/before --after-root examples/rollout/versioned --graph mermaid --check-order examples/rollout/order.json index.html hours/index.html)" || status=$?
          test "$status" -eq 2
          test -z "$report"

      - name: Review and replay a phased site release
        env:
          MOON_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const sample = "examples/rollout";
          const pages = ["index.html", "hours/index.html"];
          const before = path.join(sample, "before");
          const overwrite = path.join(sample, "overwrite");
          const versioned = path.join(sample, "versioned");
          function cli(expected, ...args) {
            const result = spawnSync("moon", [
              "run", "cmd/main", "--target", process.env.MOON_TARGET, "--", ...args
            ], { encoding: "utf8" });
            if (result.error) throw result.error;
            assert.equal(result.status, expected, result.stdout + result.stderr);
            return result.stdout;
          }
          function audit(root, expected = 0) {
            cli(expected, "audit-html", "--root", root, ...pages);
          }
          function plan(root, expected) {
            return JSON.parse(cli(expected, "review-release", "--before-root", before,
              "--after-root", root, "--json", ...pages));
          }
          function copyAction(state, source, action) {
            const destination = path.join(state, action.path);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(path.join(source, action.path), destination);
          }
          [before, overwrite, versioned].forEach(root => audit(root));
          const blocked = plan(overwrite, 1);
          assert.equal(blocked.status, "blocked");
          assert.deepEqual(blocked.cycle[0], blocked.cycle.at(-1));
          assert(blocked.cycle.some(action => action.kind === "replace_asset"));
          assert(blocked.cycle.some(action => action.kind === "switch_page"));
          for (let index = 1; index < blocked.cycle.length; index++) {
            assert(blocked.constraints.some(edge =>
              JSON.stringify(edge.first) === JSON.stringify(blocked.cycle[index - 1]) &&
              JSON.stringify(edge.then) === JSON.stringify(blocked.cycle[index])
            ));
          }

          const safe = plan(versioned, 0);
          assert.equal(safe.status, "safe");
          assert.equal(safe.cycle.length, 0);
          assert.deepEqual(safe.waves.map(wave => wave.map(action => action.kind)), [
            ["publish_asset", "publish_asset"], ["switch_page", "switch_page"]
          ]);
          const temp = fs.mkdtempSync(path.join(os.tmpdir(), "moonsri-rollout-"));
          try {
            const state = path.join(temp, "live");
            fs.cpSync(before, state, { recursive: true });
            copyAction(state, overwrite, { path: "assets/banner.js" });
            audit(state);
            for (const action of blocked.cycle.slice(0, -1)) {
              copyAction(state, overwrite, action);
              audit(state, 1);
              copyAction(state, before, action);
            }
            fs.unlinkSync(path.join(state, "assets", "banner.js"));
            for (const wave of safe.waves) {
              for (const action of [...wave].reverse()) {
                copyAction(state, versioned, action);
                audit(state);
              }
            }
            assert(fs.existsSync(path.join(state, "assets", "app.js")));
            cli(2, "review-release", "--before-root", before, "--after-root",
              versioned, "--json", "missing.html");

            const oldRoot = path.join(temp, "old-inventory");
            const newRoot = path.join(temp, "new-inventory");
            const oldPage = "retiring guide.html";
            const newPage = "new guide.html";
            const beforeList = path.join(temp, "before pages.txt");
            const afterList = path.join(temp, "after pages.txt");
            fs.cpSync(path.join(before, "assets"), path.join(oldRoot, "assets"), { recursive: true });
            fs.cpSync(path.join(overwrite, "assets"), path.join(newRoot, "assets"), { recursive: true });
            fs.renameSync(path.join(oldRoot, "assets/site.css"), path.join(oldRoot, "assets/legacy.css"));
            fs.renameSync(path.join(newRoot, "assets/site.css"), path.join(newRoot, "assets/next.css"));
            fs.writeFileSync(path.join(oldRoot, oldPage),
              fs.readFileSync(path.join(before, "hours/index.html"), "utf8").replace("/assets/site.css", "/assets/legacy.css"));
            fs.writeFileSync(path.join(newRoot, newPage),
              fs.readFileSync(path.join(overwrite, "hours/index.html"), "utf8").replace("/assets/site.css", "/assets/next.css"));
            fs.writeFileSync(beforeList, "\uFEFF" + oldPage + "\r\n\r\n");
            fs.writeFileSync(afterList, newPage + "\n");
            const args = ["review-release", "--before-root", oldRoot, "--after-root", newRoot,
              "--before-pages", beforeList, "--after-pages", afterList, "--json"];
            const inventory = JSON.parse(cli(0, ...args));
            assert.deepEqual(inventory.waves, [
              [{ kind: "publish_asset", path: "assets/next.css" }, { kind: "retire_page", path: oldPage }],
              [{ kind: "replace_asset", path: "assets/app.js" }],
              [{ kind: "publish_page", path: newPage }]
            ]);
            assert.deepEqual(inventory.retained_assets, ["assets/legacy.css"]);
            assert.deepEqual(inventory.cycle, []);
            const liveInventory = path.join(temp, "live-inventory");
            fs.cpSync(oldRoot, liveInventory, { recursive: true });
            const activePages = new Set([oldPage]);
            for (const wave of inventory.waves) {
              for (const action of [...wave].reverse()) {
                if (action.kind === "retire_page") {
                  fs.unlinkSync(path.join(liveInventory, action.path));
                  activePages.delete(action.path);
                } else {
                  copyAction(liveInventory, newRoot, action);
                  if (action.kind === "publish_page") activePages.add(action.path);
                }
                if (activePages.size > 0) cli(0, "audit-html", "--root", liveInventory, ...activePages);
              }
            }
            assert.deepEqual([...activePages], [newPage]);
            assert(fs.existsSync(path.join(liveInventory, "assets", "legacy.css")));
            cli(2, ...args, oldPage);
            fs.writeFileSync(beforeList, oldPage + "\n" + oldPage + "\n");
            cli(2, ...args);
            fs.writeFileSync(beforeList, "");
            const firstLaunch = JSON.parse(cli(0, ...args));
            assert.deepEqual(firstLaunch.waves.map(wave => wave.map(action => action.kind)), [
              ["publish_asset", "publish_asset"], ["publish_page"]
            ]);
            fs.writeFileSync(afterList, "");
            cli(2, ...args);
            fs.writeFileSync(beforeList, oldPage + "\n");
            const shutdown = JSON.parse(cli(0, ...args));
            assert.deepEqual(shutdown.waves, [[{ kind: "retire_page", path: oldPage }]]);
            assert.deepEqual(shutdown.retained_assets, ["assets/app.js", "assets/legacy.css"]);
          } finally {
            fs.rmSync(temp, { recursive: true, force: true });
          }
          NODE
