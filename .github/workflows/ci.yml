name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: CLI smoke test
        shell: bash
        run: |
          expected='sha384-uY+OtEjszwPe7jcYKI1KfAGMrLSMeFfhJc/DWf9ccFpWjjw1tKO9St/U0k2N8ONW'
          actual="$(moon run cmd/main --target ${{ matrix.target }} -- generate examples/hello.js)"
          test "$actual" = "$expected"
          moon run cmd/main --target ${{ matrix.target }} -- check examples/hello.js "$expected"
          diagnostics="$(mktemp)"
          trap 'rm -f -- "$diagnostics"' EXIT
          status=0
          rejected="$(moon run cmd/main --target ${{ matrix.target }} -- typo generate examples/hello.js 2>"$diagnostics")" || status=$?
          test "$status" -eq 2
          test -z "$rejected"
          [[ "$(<"$diagnostics")" == *'Usage:'* ]]
          status=0
          report="$(moon run cmd/main --target ${{ matrix.target }} -- check-manifest --json 2>"$diagnostics")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$diagnostics")" == *'Usage:'* ]]
      - name: HTML tag smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          script="$(run_cli tag script examples/hello.js hello.js)"
          stylesheet="$(run_cli tag stylesheet examples/style.css style.css)"
          demo="$(< examples/browser.html)"
          [[ "$demo" == *"$script"* ]]
          [[ "$demo" == *"$stylesheet"* ]]
          escaped="$(run_cli tag script examples/hello.js 'hello.js?q="a"&lang=zh')"
          [[ "$escaped" == *'src="hello.js?q=&quot;a&quot;&amp;lang=zh"'* ]]
          status=0
          unsafe="$(run_cli tag script examples/hello.js 'javascript:alert(1)')" || status=$?
          test "$status" -eq 2
          test -z "$unsafe"
      - name: Batch manifest smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          temp_dir="$(mktemp -d .moonsri-test.XXXXXX)"
          run_cli manifest --root examples hello.js > "$temp_dir/rooted.json"
          test "$(run_cli check-manifest --root examples "$temp_dir/rooted.json")" = 'match: "hello.js"'
          test "$(run_cli check-manifest --root examples/ "$temp_dir/rooted.json")" = 'match: "hello.js"'
          printf '%s\n' '{"hello.js":"sha384-invalid","../README.md":"sha384-invalid"}' > "$temp_dir/invalid-root.json"
          status=0
          report="$(run_cli check-manifest --root examples "$temp_dir/invalid-root.json")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/rooted.json"
          printf '%s\n' '{"hello.js":"sha384-invalid","asset?.js":"sha384-invalid"}' > "$temp_dir/nonportable.json"
          status=0
          report="$(run_cli check-manifest --root examples --json "$temp_dir/nonportable.json" 2>"$temp_dir/nonportable.err")" || status=$?
          test "$status" -eq 2
          test -z "$report"
          [[ "$(<"$temp_dir/nonportable.err")" == *'Expected a portable relative asset path:'* ]]
          printf '%s\n' '{"style.css":"sha384-new","hello.js":"sha384-updated"}' > "$temp_dir/next.json"
          status=0
          report="$(run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/next.json")" || status=$?
          test "$status" -eq 1
          grep -Fq 'changed: "hello.js"' <<< "$report"
          grep -Fq 'added: "style.css"' <<< "$report"
          status=0
          run_cli manifest --root examples ../README.md || status=$?
          test "$status" -eq 2
          asset="$temp_dir/copied style.css"
          manifest="$temp_dir/integrity.json"
          cp examples/style.css "$asset"
          printf '\357\273\277examples/hello.js\r\n\r\n%s\r\n' "$asset" > "$temp_dir/assets.txt"
          run_cli manifest --from "$temp_dir/assets.txt" > "$temp_dir/from-list.json"
          run_cli check-manifest "$temp_dir/from-list.json"
          run_cli manifest --algorithm sha256 examples/hello.js > "$temp_dir/weak.json"
          run_cli check-manifest --min-algorithm sha256 "$temp_dir/weak.json"
          status=0
          report="$(run_cli check-manifest --json --min-algorithm sha384 "$temp_dir/weak.json")" || status=$?
          test "$status" -eq 1
          grep -Fq '"examples/hello.js": "below_minimum"' <<< "$report"
          sha256="$(run_cli generate examples/hello.js sha256)"
          sha512="$(run_cli generate examples/hello.js sha512)"
          combined="$(run_cli generate examples/hello.js sha256,sha512)"
          test "$combined" = "$sha256 $sha512"
          run_cli manifest --algorithm sha256,sha512 examples/hello.js "$asset" > "$manifest"
          node -e 'const manifest = require(process.argv[1]); if (manifest["examples/hello.js"] !== process.argv[2]) process.exit(1)' "./$manifest" "$combined"
          report="$(run_cli check-manifest "$manifest")"
          grep -Fq 'match: "examples/hello.js"' <<< "$report"
          grep -Fq "match: \"$asset\"" <<< "$report"

          printf '\n/* changed */\n' >> "$asset"
          status=0
          report="$(run_cli check-manifest "$manifest")" || status=$?
          test "$status" -eq 1
          grep -Fq "mismatch: \"$asset\"" <<< "$report"

          status=0
          report="$(run_cli check-manifest --json "$manifest")" || status=$?
          test "$status" -eq 1
          node -e 'const report = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (report["examples/hello.js"] !== "match" || report[process.argv[1]] !== "mismatch") process.exit(1)' "$asset" <<< "$report"

          mv "$asset" "$temp_dir/moved.css"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          printf '{"examples/hello.js":"sha256-a","examples/hello.js":"sha256-b"}\n' > "$manifest"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          if [ "${{ matrix.target }}" = js ]; then
            node - "$manifest" "$temp_dir" <<'JS'
          const fs = require("node:fs");
          const entries = Array.from({ length: 3000 }, (_, i) => [
            process.argv[3] + "/missing-asset-" + i + ".css",
            "sha384-invalid",
          ]);
          fs.writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(entries)));
          JS
            status=0
            report="$(run_cli check-manifest --json "$manifest")" || status=$?
            test "$status" -eq 2
            node -e 'const results = Object.values(JSON.parse(require("node:fs").readFileSync(0, "utf8"))); if (results.length !== 3000 || results.some(result => result !== "read_error")) process.exit(1)' <<< "$report"
          fi
      - name: HTML audit smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          site="$(mktemp -d .moonsri-audit.XXXXXX)"
          mkdir -p "$site/docs" "$site/site assets"
          cp examples/hello.js "$site/app main.js"
          cp examples/hello.js "$site/site assets/app main.js"
          cp examples/style.css "$site/style.css"
          run_cli tag script examples/hello.js '../app%20main.js?v=1' > "$site/docs/ok.html"
          printf '%s\n' '<base href=" / ">' > "$site/docs/base.html"
          run_cli tag script examples/hello.js 'app%20main.js' >> "$site/docs/base.html"
          report="$(run_cli audit-html --root "$site" --json docs/ok.html docs/base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.status !== "ok" || p.resources.length !== 1 || p.resources[0].status !== "match" || p.resources[0].path !== "app main.js")) process.exit(1)' <<< "$report"

          printf '%s\n' '<base href="../site%20assets/">' > "$site/docs/local-base.html"
          printf '%s\n' '<base href="/site%20assets/home.html">' > "$site/docs/file-base.html"
          run_cli tag script examples/hello.js 'app%20main.js' | tee -a "$site/docs/local-base.html" >> "$site/docs/file-base.html"
          report="$(run_cli audit-html --root "$site" --json docs/local-base.html docs/file-base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.resources[0]?.path !== "site assets/app main.js" || p.resources[0]?.status !== "match")) process.exit(1)' <<< "$report"

          cp "$site/docs/ok.html" "$site/docs/fail.html"
          printf '%s\n' '<link rel=stylesheet href=/style.css>' '<script src="https://cdn.example/app.js"></script>' >> "$site/docs/fail.html"
          status=0
          report="$(run_cli audit-html --root "$site" --json docs/fail.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.status !== "failed" || page.resources.map(r => r.status).join(",") !== "match,missing_integrity,external") process.exit(1)' <<< "$report"

          status=0
          report="$(run_cli audit-html --root examples --json browser.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.resources.map(r => r.status).join(",") !== "match,match,mismatch") process.exit(1)' <<< "$report"

          printf '%s\n' '<base href="https://cdn.example/assets/"><script src="app.js"></script>' > "$site/docs/unsupported.html"
          status=0
          report="$(run_cli audit-html --root "$site" --json docs/unsupported.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.status !== "unsupported_base" || page.resources.length !== 0) process.exit(1)' <<< "$report"

          baseline="$site/baseline.json"
          run_cli manifest --root "$site" 'app main.js' > "$baseline"
          report="$(run_cli audit-html --root "$site" --baseline "$baseline" --json docs/ok.html docs/base.html)"
          node -e 'const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (pages.length !== 2 || pages.some(p => p.resources[0]?.baseline.declaration !== "match" || p.resources[0]?.baseline.content !== "match")) process.exit(1)' <<< "$report"

          cp "$site/docs/ok.html" "$site/docs/shared.html"
          run_cli tag script examples/hello.js '../app%20main.js?v=2' sha512 >> "$site/docs/shared.html"
          run_cli tag script examples/hello.js '../app%20main.js?v=3' sha256 >> "$site/docs/shared.html"
          printf '%s\n' '<script src="../app%20main.js" integrity="sha999-invalid"></script>' '<script src="../missing.js" integrity="sha999-invalid"></script>' >> "$site/docs/shared.html"
          status=0
          report="$(run_cli audit-html --root "$site" --min-algorithm sha384 --json docs/shared.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [page] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (page.resources.map(r => r.status).join(",") !== "match,match,below_minimum,no_supported_metadata,read_error") process.exit(1)' <<< "$report"

          printf '\nconsole.log("rebuilt");\n' >> "$site/app main.js"
          run_cli tag script "$site/app main.js" '../app%20main.js' > "$site/docs/rebuilt.html"
          run_cli tag stylesheet "$site/style.css" '/style.css' > "$site/docs/untracked.html"
          run_cli audit-html --root "$site" docs/rebuilt.html
          status=0
          report="$(run_cli audit-html --root "$site" --baseline "$baseline" --json docs/rebuilt.html docs/untracked.html)" || status=$?
          test "$status" -eq 1
          node -e 'const [rebuilt, untracked] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); const a = rebuilt.resources[0], b = untracked.resources[0]; if (a.status !== "match" || a.baseline.declaration !== "drift" || a.baseline.content !== "mismatch" || b.baseline.declaration !== "untracked" || b.baseline.content !== "not_checked") process.exit(1)' <<< "$report"

      - name: HTML reference diff smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          site="$(mktemp -d)"
          trap 'rm -rf -- "$site"' EXIT
          before="$site/before"
          after="$site/after"
          for root in "$before" "$after"; do
            mkdir -p "$root/docs"
            cp examples/hello.js "$root/app.js"
            cp examples/hello.js "$root/optional.js"
            cp examples/style.css "$root/style.css"
          done
          old="$(run_cli generate "$before/app.js" sha384)"
          new="$(run_cli generate "$after/app.js" sha512)"
          css="$(run_cli tag stylesheet "$before/style.css" '/style.css')"
          printf '<script src="../app.js" integrity="%s"></script>\n%s\n<script src="../optional.js" integrity="%s"></script>\n' "$old" "$css" "$old" > "$before/docs/index.html"
          printf '%s\n<script src="/app.js" integrity="%s"></script>\n<script src="/optional.js?v=2" integrity="%s"></script>\n' "$css" "$new" "$old" > "$after/docs/index.html"
          printf '<script src="../app.js?v=1#main" integrity="%s"></script>\n' "$old" > "$before/docs/same.html"
          printf '<base href="/"><script src="app.js?v=1#main" integrity="%s %s"></script>\n' "${old/sha384/SHA384}" "$old" > "$after/docs/same.html"
          cp "$before/docs/same.html" "$before/docs/missing.html"

          run_cli audit-html --root "$before" docs/index.html docs/same.html
          run_cli audit-html --root "$after" docs/index.html docs/same.html
          run_cli diff-html --before-root "$before" --after-root "$after" docs/same.html
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --json docs/same.html docs/index.html)" || status=$?
          test "$status" -eq 1
          DIFF_REPORT="$report" node <<'NODE'
          const assert = require("node:assert/strict");
          const [same, changed] = JSON.parse(process.env.DIFF_REPORT);
          assert.equal(same.status, "unchanged");
          assert.equal(changed.status, "changed");
          assert.equal(changed.removed[0].url, "../optional.js");
          assert.equal(changed.added[0].url, "/optional.js?v=2");
          assert.equal(changed.integrity_changed.length, 1);
          const update = changed.integrity_changed[0];
          assert.equal(update.before.position, 1);
          assert.equal(update.after.position, 2);
          assert.equal(update.after.path, "app.js");
          assert.equal(changed.order_changed, true);
          assert.equal(changed.before_order[0].kind, "script");
          assert.equal(changed.after_order[0].kind, "stylesheet");
          NODE
          status=0
          report="$(run_cli diff-html --before-root "$before" --after-root "$after" --json docs/index.html docs/missing.html)" || status=$?
          test "$status" -eq 2
          node -e 'const [changed, missing] = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (changed.status !== "changed" || missing.status !== "error" || missing.after_error !== "read_error") process.exit(1)' <<< "$report"
