name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: CLI smoke test
        shell: bash
        run: |
          expected='sha384-uY+OtEjszwPe7jcYKI1KfAGMrLSMeFfhJc/DWf9ccFpWjjw1tKO9St/U0k2N8ONW'
          actual="$(moon run cmd/main --target ${{ matrix.target }} -- generate examples/hello.js)"
          test "$actual" = "$expected"
          moon run cmd/main --target ${{ matrix.target }} -- check examples/hello.js "$expected"
      - name: HTML tag smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          script="$(run_cli tag script examples/hello.js hello.js)"
          stylesheet="$(run_cli tag stylesheet examples/style.css style.css)"
          demo="$(< examples/browser.html)"
          [[ "$demo" == *"$script"* ]]
          [[ "$demo" == *"$stylesheet"* ]]
          escaped="$(run_cli tag script examples/hello.js 'hello.js?q="a"&lang=zh')"
          [[ "$escaped" == *'src="hello.js?q=&quot;a&quot;&amp;lang=zh"'* ]]
          status=0
          unsafe="$(run_cli tag script examples/hello.js 'javascript:alert(1)')" || status=$?
          test "$status" -eq 2
          test -z "$unsafe"
      - name: Batch manifest smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          temp_dir="$(mktemp -d .moonsri-test.XXXXXX)"
          run_cli manifest --root examples hello.js > "$temp_dir/rooted.json"
          test "$(run_cli check-manifest --root examples "$temp_dir/rooted.json")" = 'match: "hello.js"'
          run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/rooted.json"
          printf '%s\n' '{"style.css":"sha384-new","hello.js":"sha384-updated"}' > "$temp_dir/next.json"
          status=0
          report="$(run_cli diff-manifest "$temp_dir/rooted.json" "$temp_dir/next.json")" || status=$?
          test "$status" -eq 1
          grep -Fq 'changed: "hello.js"' <<< "$report"
          grep -Fq 'added: "style.css"' <<< "$report"
          status=0
          run_cli manifest --root examples ../README.md || status=$?
          test "$status" -eq 2
          asset="$temp_dir/copied style.css"
          manifest="$temp_dir/integrity.json"
          cp examples/style.css "$asset"
          printf '\357\273\277examples/hello.js\r\n\r\n%s\r\n' "$asset" > "$temp_dir/assets.txt"
          run_cli manifest --from "$temp_dir/assets.txt" > "$temp_dir/from-list.json"
          run_cli check-manifest "$temp_dir/from-list.json"
          run_cli manifest --algorithm sha256 examples/hello.js > "$temp_dir/weak.json"
          run_cli check-manifest --min-algorithm sha256 "$temp_dir/weak.json"
          status=0
          report="$(run_cli check-manifest --json --min-algorithm sha384 "$temp_dir/weak.json")" || status=$?
          test "$status" -eq 1
          grep -Fq '"examples/hello.js": "below_minimum"' <<< "$report"
          sha256="$(run_cli generate examples/hello.js sha256)"
          sha512="$(run_cli generate examples/hello.js sha512)"
          combined="$(run_cli generate examples/hello.js sha256,sha512)"
          test "$combined" = "$sha256 $sha512"
          run_cli manifest --algorithm sha256,sha512 examples/hello.js "$asset" > "$manifest"
          node -e 'const manifest = require(process.argv[1]); if (manifest["examples/hello.js"] !== process.argv[2]) process.exit(1)' "./$manifest" "$combined"
          report="$(run_cli check-manifest "$manifest")"
          grep -Fq 'match: "examples/hello.js"' <<< "$report"
          grep -Fq "match: \"$asset\"" <<< "$report"

          printf '\n/* changed */\n' >> "$asset"
          status=0
          report="$(run_cli check-manifest "$manifest")" || status=$?
          test "$status" -eq 1
          grep -Fq "mismatch: \"$asset\"" <<< "$report"

          status=0
          report="$(run_cli check-manifest --json "$manifest")" || status=$?
          test "$status" -eq 1
          node -e 'const report = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (report["examples/hello.js"] !== "match" || report[process.argv[1]] !== "mismatch") process.exit(1)' "$asset" <<< "$report"

          mv "$asset" "$temp_dir/moved.css"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          printf '{"examples/hello.js":"sha256-a","examples/hello.js":"sha256-b"}\n' > "$manifest"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          if [ "${{ matrix.target }}" = js ]; then
            node - "$manifest" "$temp_dir" <<'JS'
          const fs = require("node:fs");
          const entries = Array.from({ length: 3000 }, (_, i) => [
            process.argv[3] + "/missing-asset-" + i + ".css",
            "sha384-invalid",
          ]);
          fs.writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(entries)));
          JS
            status=0
            report="$(run_cli check-manifest --json "$manifest")" || status=$?
            test "$status" -eq 2
            node -e 'const results = Object.values(JSON.parse(require("node:fs").readFileSync(0, "utf8"))); if (results.length !== 3000 || results.some(result => result !== "read_error")) process.exit(1)' <<< "$report"
          fi
