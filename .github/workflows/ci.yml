name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: CLI smoke test
        shell: bash
        run: |
          expected='sha384-uY+OtEjszwPe7jcYKI1KfAGMrLSMeFfhJc/DWf9ccFpWjjw1tKO9St/U0k2N8ONW'
          actual="$(moon run cmd/main --target ${{ matrix.target }} -- generate examples/hello.js)"
          test "$actual" = "$expected"
          moon run cmd/main --target ${{ matrix.target }} -- check examples/hello.js "$expected"
      - name: Batch manifest smoke test
        shell: bash
        run: |
          run_cli() {
            moon run cmd/main --target ${{ matrix.target }} -- "$@"
          }
          temp_dir="$(mktemp -d .moonsri-test.XXXXXX)"
          asset="$temp_dir/copied style.css"
          manifest="$temp_dir/integrity.json"
          cp examples/style.css "$asset"
          run_cli manifest --algorithm sha512 examples/hello.js "$asset" > "$manifest"
          report="$(run_cli check-manifest "$manifest")"
          grep -Fq 'match: "examples/hello.js"' <<< "$report"
          grep -Fq "match: \"$asset\"" <<< "$report"

          printf '\n/* changed */\n' >> "$asset"
          status=0
          report="$(run_cli check-manifest "$manifest")" || status=$?
          test "$status" -eq 1
          grep -Fq "mismatch: \"$asset\"" <<< "$report"

          mv "$asset" "$temp_dir/moved.css"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2

          printf '{"examples/hello.js":"sha256-a","examples/hello.js":"sha256-b"}\n' > "$manifest"
          status=0
          run_cli check-manifest "$manifest" || status=$?
          test "$status" -eq 2
